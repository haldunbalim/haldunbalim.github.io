# Minimal Jekyll site, Jon Barron style. No plugins, so GitHub Pages can build it as-is.
#
# Content lives in _data/ (profile, news, publications, people) and _includes/bio.md.
# Layouts in _layouts/ only decide how that content looks.

title: Haldun Balim
description: Ph.D. candidate at Harvard SEAS working on control, machine learning and embodied intelligence.
url: https://haldunbalim.github.io
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: false

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - assets/img/prof_pic.jpg   # original upload: carries GPS EXIF; profile.jpg is the stripped copy
