- id: steer
  title: Diverse Low-Temperature Diffusion Sampling through Replica Exchange
  authors: [Zoe Wu, Haldun Balim, Yilun Du]
  venue: ICLR
  year: 2027
  status: under review
  selected: true
  media:
    - {video: /assets/media/steer/lift.mp4, label: Lift}
    - {video: /assets/media/steer/can.mp4, label: Can}
    - {video: /assets/media/steer/square.mp4, label: Square}
    - {video: /assets/media/steer/tool-hang.mp4, label: Tool Hang}
  links:
    project page: https://zoewu.com/STEER/
    code: https://github.com/zoewuez/STEER
  tldr: >-
    Several diffusion chains at different sharpening strengths swap samples via energy-based acceptance, giving
    verifier-free sampling that is both sharp and diverse; it raises success on Robomimic manipulation with the
    same diffusion policy.
  abstract: >-
    Diffusion models achieve strong generative performance across domains. However, achieving high sample quality
    under hard physical and dynamical constraints, as in protein design and robotic manipulation, remains
    difficult. Existing inference-time methods either require a costly or unavailable verifier, or avoid a verifier
    at the cost of reduced diversity. To relieve this tension, we introduce Score Tempering with Exchange between
    Exploratory Replicas (STEER), a verifier-free inference-time method that replaces single-chain sharpening with
    global search using multiple diffusion chains. During sampling, neighboring chains, each at different sharpening
    strengths, exchange particles according to an energy-based acceptance rate, propagating exploration to
    outputted samples. Across a diverse range of domains, from synthetic multimodal distributions to image
    generation, STEER achieves a better fidelity-diversity trade-off and improves success rates on
    continuous-control tasks in both verifier-based and verifier-free settings. Our findings suggest that effective
    diffusion tempering requires going beyond local updates to population-based global search that enhance fidelity
    and diversity.

- id: ddpl
  title: Decentralized Diffusion Policy Learning for Enhanced Exploration in Cooperative Multi-agent Reinforcement Learning
  authors: [Yuyang Zhang, Haldun Balim, Na Li]
  venue: arXiv preprint
  year: 2026
  image: ddpl.jpg
  media:
    # task clip from the Bi-DexHands README (PKU-MARL, Apache-2.0) -- illustrates the task, not a DDPL rollout
    - {video: /assets/media/ddpl/shadow-hand-over.mp4, label: Shadow Hand Over, wide: true}
    - {image: /assets/img/pubs/ddpl.jpg, wide: true}
  selected: true
  links:
    arXiv: https://arxiv.org/abs/2605.07101
  tldr: >-
    Gaussian policies cripple exploration in decentralized MARL as the number of agents grows; giving each agent a
    diffusion policy, trained online with importance sampling score matching, restores multi-modal exploration.
  abstract: >-
    Cooperative multi-agent reinforcement learning (MARL) involves complex agent interactions and requires effective
    exploration strategies. A prominent class of MARL algorithms, decentralized softmax policy gradient (DecSPG),
    addresses this through energy-based policy updates. In practice, however, such energy-based policies are
    intractable to maintain and are commonly projected onto the Gaussian policy class. In this work, we show that the
    limited expressiveness of Gaussian policies severely hinders exploration in DecSPG, and this limitation worsens as
    the number of agents grows. To address this issue, we propose decentralized diffusion policy learning (DDPL),
    which parameterizes each agent's policy with a denoising diffusion probabilistic model, an expressive generative
    model that captures multi-modal action distributions for enhanced exploration. DDPL enables efficient online
    training of diffusion policies via importance sampling score matching (ISSM), a novel training method with
    theoretical guarantee. We evaluate DDPL on representative continuous-action MARL benchmarks, including
    multi-agent particle environment, multi-agent MuJoCo, IsaacLab, and JAX-reimplemented StarCraft multi-agent
    challenge, and observe consistently improved performance.

- id: predictive-il
  title: A Model-Based Approach to Imitation Learning through Multi-Step Predictions
  authors: [Haldun Balim, Yang Hu, Yuyang Zhang, Na Li]
  venue: IEEE CDC
  year: 2025
  image: predictive-il.jpg
  selected: true
  links:
    paper: https://doi.org/10.1109/CDC57313.2025.11312275
    arXiv: https://arxiv.org/abs/2504.13413
  tldr: >-
    MPC-inspired imitation learning: multi-step state predictions make the learned policy robust to distribution
    shift and measurement noise, with sample-complexity and error guarantees.
  abstract: >-
    Imitation learning is a widely used approach for training agents to replicate expert behavior in complex
    decision-making tasks. However, existing methods often struggle with compounding errors and limited
    generalization, due to the inherent challenge of error correction and the distribution shift between training
    and deployment. In this paper, we present a novel model-based imitation learning framework inspired by model
    predictive control, which addresses these limitations by integrating predictive modeling through multi-step
    state predictions. Our method outperforms traditional behavior cloning numerical benchmarks, demonstrating
    superior robustness to distribution shift and measurement noise both in available data and during execution.
    Furthermore, we provide theoretical guarantees on the sample complexity and error bounds of our method, offering
    insights into its convergence properties.

- id: multistep
  title: "Stochastic Data-Driven Predictive Control: Chance-Constraint Satisfaction with Identified Multi-Step Predictors"
  authors: [Haldun Balim, Andrea Carron, Melanie N. Zeilinger, Johannes Köhler]
  venue: IEEE Control Systems Letters (L-CSS)
  year: 2024
  image: multistep.jpg
  selected: true
  links:
    paper: https://doi.org/10.1109/LCSYS.2024.3523238
    arXiv: https://arxiv.org/abs/2409.10405
    code: https://github.com/haldunbalim/MultistepPredictors
  tldr: >-
    Identified multi-step predictors propagate uncertainty efficiently, giving a constraint tightening that
    guarantees chance-constraint satisfaction with less conservatism than state-of-the-art methods.
  abstract: >-
    We propose a novel data-driven stochastic model predictive control framework for uncertain linear systems with
    noisy output measurements. Our approach leverages multi-step predictors to efficiently propagate uncertainty,
    ensuring chance constraint satisfaction. In particular, we present a strategy to identify multi-step predictors
    and quantify the associated uncertainty using a surrogate (data-driven) state space model. Then, we utilize the
    derived distribution to formulate a constraint tightening that ensures chance constraint satisfaction despite
    the parametric uncertainty. A numerical example highlights the reduced conservatism of handling parametric
    uncertainty in the proposed method compared to state-of-the-art solutions.

- id: d2pc
  title: "From Data to Predictive Control: A Framework for Stochastic Linear Systems with Output Measurements"
  authors: [Haldun Balim, Andrea Carron, Melanie N. Zeilinger, Johannes Köhler]
  venue: arXiv preprint
  year: 2024
  image: d2pc.jpg
  selected: true
  links:
    arXiv: https://arxiv.org/abs/2407.17277
    code: https://github.com/haldunbalim/D2PC
  tldr: >-
    From input-output data to a predictive controller: EM-based identification with structural constraints,
    uncertainty quantification, robust output-feedback synthesis and chance-constrained MPC.
  abstract: >-
    We introduce data to predictive control, D2PC, a framework to facilitate the design of robust and predictive
    controllers from data. The proposed framework is designed for discrete-time stochastic linear systems with
    output measurements and provides a principled design of a predictive controller based on data. The framework
    builds on a parameter identification method based on the Expectation-Maximization algorithm, which incorporates
    pre-defined structural constraints. An asymptotic approximation is leveraged to quantify the uncertainty in the
    parameter estimates. As the main contributions, a robust control and predictive control design are proposed
    tailored to the uncertainty characterization resulting from the identification. In particular, a strategy to
    synthesize robust dynamic output-feedback controllers is presented. Furthermore, a predictive control scheme
    that guarantees recursive feasibility and satisfaction of chance constraints is developed. This framework marks
    a significant advancement in integrating data-driven models into robust and predictive control designs. We
    demonstrate the efficacy of D2PC through a numerical example involving a 10-dimensional spring-mass-damper system.

- id: transformer-filtering
  title: Can Transformers Learn Optimal Filtering for Unknown Systems?
  authors: [Haldun Balim*, Zhe Du*, Samet Oymak, Necmiye Ozay]
  venue: IEEE Control Systems Letters (L-CSS)
  year: 2023
  image: transformer-filtering.jpg
  selected: true
  links:
    paper: https://doi.org/10.1109/LCSYS.2023.3335318
    arXiv: https://arxiv.org/abs/2308.08536
    code: https://github.com/haldunbalim/Meta-Output-Predictor
  tldr: >-
    A transformer trained on many systems adapts in context to unseen ones and matches the Kalman filter on linear
    systems; we give sample-complexity guarantees and identify where it breaks down.
  abstract: >-
    Transformer models have shown great success in natural language processing; however, their potential remains
    mostly unexplored for dynamical systems. In this work, we investigate the optimal output estimation problem
    using transformers, which generate output predictions using all the past ones. Particularly, we train the
    transformer using various distinct systems and then evaluate the performance on unseen systems with unknown
    dynamics. Empirically, the trained transformer adapts exceedingly well to different unseen systems and even
    matches the optimal performance given by the Kalman filter for linear systems. In more complex settings with
    non-i.i.d. noise, time-varying dynamics, and nonlinear dynamics like a quadrotor system with unknown parameters,
    transformers also demonstrate promising results. To support our experimental findings, we provide statistical
    guarantees that quantify the amount of training data required for the transformer to achieve a desired excess
    risk. Finally, we point out some limitations by identifying two classes of problems that lead to degraded
    performance, highlighting the need for caution when using transformers for control and estimation.

- id: koopman-brs
  title: Koopman-inspired Implicit Backward Reachable Sets for Unknown Nonlinear Systems
  authors: [Haldun Balim, Antoine Aspeel, Zexiang Liu, Necmiye Ozay]
  venue: IEEE Control Systems Letters (L-CSS)
  year: 2023
  image: koopman-brs.jpg
  selected: true
  links:
    paper: https://doi.org/10.1109/LCSYS.2023.3286126
    arXiv: https://arxiv.org/abs/2306.07113
    project page: https://haldunbalim.github.io/KoopmanBRS-page/
    code: https://github.com/haldunbalim/KoopmanBRS
  tldr: >-
    Learned Koopman over-approximations enable correct-by-construction control: backward reachable sets computed in
    the lifted space give implicit inner approximations for the unknown nonlinear dynamics.
  abstract: >-
    Koopman liftings have been successfully used to learn high dimensional linear approximations for autonomous
    systems for prediction purposes, or for control systems for leveraging linear control techniques to control
    nonlinear dynamics. In this paper, we show how learned Koopman approximations can be used for state-feedback
    correct-by-construction control. To this end, we introduce the Koopman over-approximation, a (possibly hybrid)
    lifted representation that has a simulation-like relation with the underlying dynamics. Then, we prove how
    successive application of controlled predecessor operation in the lifted space leads to an implicit backward
    reachable set for the actual dynamics. Finally, we demonstrate the approach on two nonlinear control examples
    with unknown dynamics.

- id: efe
  title: "EFE: End-to-End Frame-to-Gaze Estimation"
  authors: [Haldun Balim, Seonwook Park, Xi Wang, Xucong Zhang, Otmar Hilliges]
  venue: CVPR Workshops (GAZE)
  year: 2023
  image: efe.jpg
  links:
    paper: https://openaccess.thecvf.com/content/CVPR2023W/GAZE/html/Balim_EFE_End-to-End_Frame-To-Gaze_Estimation_CVPRW_2023_paper.html
    arXiv: https://arxiv.org/abs/2305.05526
  tldr: >-
    Predict 3D gaze origin and direction directly from the raw camera frame, with no face or eye crops, at accuracy
    comparable to crop-based methods.
  abstract: >-
    Despite the recent development of learning-based gaze estimation methods, most methods require one or more eye
    or face region crops as inputs and produce a gaze direction vector as output. Cropping results in a higher
    resolution in the eye regions and having fewer confounding factors (such as clothing and hair) is believed to
    benefit the final model performance. However, this eye/face patch cropping process is expensive, erroneous, and
    implementation-specific for different methods. In this paper, we propose a frame-to-gaze network that directly
    predicts both 3D gaze origin and 3D gaze direction from the raw frame out of the camera without any face or eye
    cropping. Our method demonstrates that direct gaze regression from the raw downscaled frame, from FHD/HD to
    VGA/HVGA resolution, is possible despite the challenges of having very few pixels in the eye region. The
    proposed method achieves comparable results to state-of-the-art methods in Point-of-Gaze (PoG) estimation on
    three public gaze datasets: GazeCapture, MPIIFaceGaze, and EVE, and generalizes well to extreme camera view changes.

