- id: fontan
  title: In Vitro Validation of a Self-Driving Aortic-Turbine Venous-Assist Device for Fontan Patients
  authors: [Kerem Pekkan, Ibrahim Basar Aka, Ece Tutsak, Erhan Ermek, Haldun Balim, Ismail Lazoglu, Riza Turkoz]
  venue: The Journal of Thoracic and Cardiovascular Surgery
  year: 2018
  image: fontan.jpg
  links:
