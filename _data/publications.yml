# Shown in this order (highlighted work first, then robotics, then the rest, roughly newest first).
#
#   authors   names as they should print. Append * for equal contribution, † for equal advising.
#             Names listed in people.yml become links; the site owner's name is bolded.
#   venue     short venue name, printed in italics before the year
#   status    optional, printed after the year in grey, e.g. "under review", "in preparation"
#   image     file in assets/img/pubs/ (optional; used when there is no `media`)
#   media     list of tiles for the thumbnail column, see _includes/pub-media.html:
#               - {video: /assets/media/x/y.mp4, label: "Real robot", wide: true}
#               - {image: /assets/media/x/z.jpg}
#             each .mp4 needs a same-named .jpg poster next to it
#   media_cols  columns of the media grid (default 2); `wide` tiles span all of them
#   selected  true -> shown by default; the rest appear under the "All" filter
#   highlight true -> yellow background (use sparingly)
#   award     award / recognition line (optional, Markdown)
#   links     label: url, printed in this order
#   tldr      one sentence (optional); with abstract (optional) it fills the "abstract" toggle

- id: proggtp
  # TODO: confirm the author list
  title: "ProgGTP: Progression-Guided Online Learning from Action-Free Demonstrations"
  authors: [Haldun Balim, Yilun Du†, Na Li†]
  venue: ICML
  year: 2027
  status: in preparation
  selected: true
  highlight: true
  media:
    - {video: /assets/media/proggtp/align.mp4, label: Align}
    - {video: /assets/media/proggtp/pickup.mp4, label: Pick up}
    - {video: /assets/media/proggtp/pour.mp4, label: Pour}
    - {video: /assets/media/proggtp/stack-bowls.mp4, label: Stack bowls}
  tldr: >-
    Expert demonstrations without action labels still show what progress looks like: ProgGTP learns a progression
    critic from them, plans against it with a dynamics model learned from suboptimal play data, and imitates only
    its own best plans, solving bimanual RoboDojo manipulation tasks from sparse success signals.

- id: gtp
  title: Model-Based Online Decision Making via Generative Trajectory Planning
  authors: [Haldun Balim, Yilun Du†, Na Li†]
  venue: NeurIPS
  year: 2026
  image: gtp.jpg
  media_cols: 3
  media:
    - {video: /assets/media/gtp/method.mp4, wide: true}
    - {video: /assets/media/gtp/fetchpush.mp4, label: Push}
    - {video: /assets/media/gtp/fetchpickandplace.mp4, label: Pick & Place}
    - {video: /assets/media/gtp/fetchslide.mp4, label: Slide}
  selected: true
  highlight: true
  links:
    paper: https://arxiv.org/abs/2610.18677
    project page: https://haldunbalim.github.io/GTPlanning/
    code: https://github.com/haldunbalim/GTPlanning
    models: https://huggingface.co/haldunbalim/GTPlanning
  tldr: >-
    A diffusion prior over action sequences, used as a proposal distribution and refined with learned dynamics,
    reward and value models, gives trajectory-level planning without solving a high-dimensional optimization at every step.
  abstract: >-
    Online decision-making faces a tension between efficient inference and long-horizon reasoning. Value-based
    methods rely on short-horizon bootstrapping that limits the propagation of long-term information, while
    trajectory optimization methods plan explicitly but must solve a high-dimensional optimization problem at every
    decision step. We propose Generative Trajectory Planning (GTP), a model-based framework that addresses this
    tension by learning a generative model as a proposal distribution over action sequences. Instead of optimizing
    sequences from scratch, GTP samples candidate sequences from a diffusion prior and refines them using learned
    dynamics, reward, and value models, enabling efficient trajectory-level reasoning. Across continuous control and
    long-horizon manipulation tasks, GTP matches or exceeds state-of-the-art model-free, diffusion-policy, and
    model-based baselines, and remains stable in regimes where strong baselines degrade. Our results suggest that
    generative models are best understood not as policies, but as structured proposal distributions for planning,
    offering a new perspective on how to integrate generative modeling with model-based decision-making.

- id: mpdiffuser
  title: Model-Based Diffusion Sampling for Predictive Control in Offline Decision Making
  authors: [Haldun Balim, Na Li, Yilun Du]
  venue: ICML
  year: 2026
  image: mpdiffuser.jpg
  media:
    - {video: /assets/media/mpdiffuser/go2.mp4, label: Real Unitree Go2, wide: true}
    - {video: /assets/media/mpdiffuser/kitchen.mp4, label: Franka Kitchen}
    - {video: /assets/media/mpdiffuser/fetch.mp4, label: Fetch Pick & Place}
  selected: true
  highlight: true
  award: "Featured in Nebius.Science [ICML 2026: Papers That Matter](https://nebius.science/stories/icml-papers-that-matter)"
  links:
    paper: https://proceedings.mlr.press/v306/balim26a.html
    arXiv: https://arxiv.org/abs/2512.08280
    project page: https://haldunbalim.github.io/MPDiffuser/
    code: https://github.com/haldunbalim/MPDiffuser
  tldr: >-
    Interleaving a diffusion planner with a diffusion dynamics model during sampling keeps generated trajectories
    both task-aligned and dynamically feasible, from D4RL and DSRL benchmarks to a real quadruped.
  abstract: >-
    Offline decision-making via diffusion models often produces trajectories that are misaligned with system
    dynamics, limiting their reliability for control. We propose Model Predictive Diffuser (MPDiffuser), a
    compositional diffusion framework that combines a diffusion planner with a dynamics diffusion model to generate
    task-aligned and dynamically plausible trajectories. MPDiffuser interleaves planner and dynamics updates during
    sampling, progressively correcting feasibility while preserving task intent. A lightweight ranking module then
    selects trajectories that best satisfy task objectives. The compositional design improves sample efficiency and
    adaptability by enabling the dynamics model to leverage diverse and previously unseen data independently of the
    planner. Empirically, we demonstrate consistent improvements over prior diffusion-based methods on unconstrained
    (D4RL) and constrained (DSRL) benchmarks, and validate practicality through deployment on a real quadrupedal robot.

- id: block-pushing
  title: A Single Diffusion-Policy Controller for Multi-Task Block Pushing with Zero-Shot Sim-to-Real Transfer
  authors: [Haitong Ma, Haldun Balim, Yang Hu, Bo Dai, Na Li]
  venue: IEEE CDC
  year: 2026
  image: block-pushing.jpg
  media:
    - {video: /assets/media/block-pushing/real.mp4, label: "Real robot, zero-shot", wide: true}
    - {video: /assets/media/block-pushing/sim.mp4, label: Simulation, wide: true}
  selected: true
  links:
    arXiv: https://arxiv.org/abs/2607.10892
    project page: https://diffusionpolicyrl.site/
  tldr: >-
    One diffusion policy, trained from scratch with RL using reverse curricula and object-centric observations,
    pushes blocks of many shapes and transfers zero-shot to a real robot.
  abstract: >-
    Diffusion policies have shown promising empirical performance in representing and learning complex maneuvers for
    robots using behavior cloning (BC). In this paper, we explore training diffusion policies from scratch using
    reinforcement learning (RL) for multi-task robotic manipulation. Specifically, we aim to train a single diffusion
    policy for block-pushing tasks with multiple shapes. The proposed framework features a simple policy loss
    function, which is a reweighted evidence lower bound used in BC-based diffusion policy training and can seamlessly
    serve as the policy learning module in RL algorithms. To address the exploration challenges arising from the
    absence of demonstrations, we incorporate reverse curriculum generation and objective-centric representations.
    Combined with the expressiveness of diffusion policies, our design supports learning of multi-task block-pushing
    policies in our sparse-reward simulation setting. We further evaluate whether the trained diffusion policy
    transfers in zero-shot to real-world tasks under varying environmental conditions including goal positions, block
    shapes, block weights and surface friction, providing evidence that this pipeline can transfer to our real-world
    block-pushing setup under the tested variations.

- id: diffusion-mpc
  title: Flexible Locomotion Learning with Diffusion Model Predictive Control
  authors: [Runhan Huang, Haldun Balim, Heng Yang, Yilun Du]
  venue: ICRA
  year: 2026
  image: diffusion-mpc.jpg
  media:
    - {video: /assets/media/diffusion-mpc/grass.mp4, label: Grass}
    - {video: /assets/media/diffusion-mpc/push.mp4, label: Balancing}
    - {video: /assets/media/diffusion-mpc/slope.mp4, label: Slope}
    - {video: /assets/media/diffusion-mpc/grass2.mp4}
  selected: true
  links:
    arXiv: https://arxiv.org/abs/2510.04234
    project page: https://flexible-diffusion-mpc.github.io/
    video: https://www.youtube.com/watch?v=GX4QhTBnTHo
    press: https://seas.harvard.edu/news/ai-powered-control-system-robots-legs
  tldr: >-
    A learned diffusion model serves as the dynamics prior inside MPC, so a legged robot can adapt to new rewards
    and constraints at test time without retraining.
  abstract: >-
    Legged locomotion demands controllers that are both robust and adaptable, while remaining compatible with task
    and safety considerations. However, model-free reinforcement learning (RL) methods often yield a fixed policy
    that can be difficult to adapt to new behaviors at test time. In contrast, Model Predictive Control (MPC)
    provides a natural approach to flexible behavior synthesis by incorporating different objectives and constraints
    directly into its optimization process. However, classical MPC relies on accurate dynamics models, which are
    often difficult to obtain in complex environments and typically require simplifying assumptions. We present
    Diffusion-MPC, which leverages a learned generative diffusion model as an approximate dynamics prior for
    planning, enabling flexible test-time adaptation through reward and constraint based optimization.
    Diffusion-MPC jointly predicts future states and actions; at each reverse step, we incorporate reward planning
    and impose constraint projection, yielding trajectories that satisfy task objectives while remaining within
    physical limits. To obtain a planning model that adapts beyond imitation pretraining, we introduce an
    interactive training algorithm for diffusion based planner: we execute our reward-and-constraint planner in
    environment, then filter and reweight the collected trajectories by their realized returns before updating the
    denoiser. Our design enables strong test-time adaptability, allowing the planner to adjust to new reward
    specifications without retraining. We validate Diffusion-MPC on real world, demonstrating strong locomotion and
    flexible adaptation.

